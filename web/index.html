<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Flavor Flow restaurant POS.">
    <meta name="theme-color" content="#2B5494">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Flavor Flow">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png"/>

    <title>Flavor Flow</title>
    <link rel="manifest" href="manifest.json">

    <style>
      html, body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
        background-color: #ffffff;
      }
    </style>

    <!-- Razorpay Checkout.js -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        function openRazorpay(options) {
          console.log("✅ Options received:", options);

          options.handler = function (response) {
            console.log("✅ Payment Success Response:", response);
            if (window.onRazorpaySuccess) {
              window.onRazorpaySuccess(response);
            }
          };

          options.modal = {
            ondismiss: function () {
              console.log("❌ Payment dismissed");
              if (window.onRazorpayFailure) {
                window.onRazorpayFailure({ error: "Payment cancelled" });
              }
            }
          };

          var rzp = new Razorpay(options);
          rzp.open();
        }
    </script>
</head>
<body>
<script>
    // Use new template token to avoid Flutter Web warning
    var serviceWorkerVersion = "{{flutter_service_worker_version}}";
    var scriptLoaded = false;

    function loadMainDartJs() {
      if (scriptLoaded) return;
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        var serviceWorkerUrl = 'flutter_service_worker.js?v=' + serviceWorkerVersion;
        navigator.serviceWorker.register(serviceWorkerUrl)
          .then((reg) => {
            function waitForActivation(serviceWorker) {
              serviceWorker.addEventListener('statechange', () => {
                if (serviceWorker.state === 'activated') {
                  console.log('Installed new service worker.');
                  loadMainDartJs();
                }
              });
            }

            if (!reg.active && (reg.installing || reg.waiting)) {
              waitForActivation(reg.installing || reg.waiting);
            } else if (!reg.active.scriptURL.endsWith(serviceWorkerVersion)) {
              console.log('New service worker available.');
              reg.update();
              waitForActivation(reg.installing);
            } else {
              console.log('Loading app from service worker.');
              loadMainDartJs();
            }
          });

        setTimeout(() => {
          if (!scriptLoaded) {
            console.warn('Failed to load app from service worker. Falling back to plain <script> tag.');
            loadMainDartJs();
          }
        }, 4000);
      });
    } else {
      loadMainDartJs();
    }

    // ✅ Firebase Messaging Setup - Complete Inline Solution
    window.fcmDataQueue = [];
    window.notificationDataReady = false;
    window.firebaseMessagingInitialized = false;

    // Initialize Firebase Messaging directly in the main page
    function initializeFirebaseMessaging() {
      if (window.firebaseMessagingInitialized) return;

      console.log("🔥 Initializing Firebase Messaging...");

      // Import Firebase scripts
      const firebaseApp = document.createElement('script');
      firebaseApp.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
      firebaseApp.type = 'module';

      const firebaseMessaging = document.createElement('script');
      firebaseMessaging.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js';
      firebaseMessaging.type = 'module';

      // Firebase initialization script
      const initScript = document.createElement('script');
      initScript.type = 'module';
      initScript.textContent = `
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js';
        import { getMessaging, onMessage, getToken } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging.js';

        const firebaseConfig = {
    apiKey: "AIzaSyCVEzgrDcjZOiv7R4QK3IH3kZBfq_Dh1Vo",
  authDomain: "resto-a0d9a.firebaseapp.com",
  projectId: "resto-a0d9a",
  storageBucket: "resto-a0d9a.firebasestorage.app",
  messagingSenderId: "799838711875",
  appId: "1:799838711875:web:0fae0ecb393db8cef624f6",
  measurementId: "G-ZPDSQ8MNJD"
        };

        try {
          const app = initializeApp(firebaseConfig);
          const messaging = getMessaging(app);

          console.log("✅ Firebase initialized successfully");
          window.firebaseApp = app;
          window.firebaseMessaging = messaging;
          window.firebaseMessagingInitialized = true;

          // Handle foreground messages
          onMessage(messaging, (payload) => {
            console.log('📩 Foreground message received:', payload);
            handleForegroundMessage(payload);
          });

          // Get FCM token
          getToken(messaging, {
            vapidKey: 'your-vapid-key-if-you-have-one' // Replace with your VAPID key if you have one
          }).then((currentToken) => {
            if (currentToken) {
              console.log('📱 FCM Token:', currentToken);
              window.fcmToken = currentToken;
              // Store token for Flutter to access
              localStorage.setItem('fcmToken', currentToken);
            } else {
              console.log('❌ No registration token available.');
            }
          }).catch((err) => {
            console.log('❌ An error occurred while retrieving token:', err);
          });

        } catch (error) {
          console.error('❌ Firebase initialization error:', error);
          // Fallback to service worker approach
          initializeServiceWorkerMessaging();
        }

        function handleForegroundMessage(payload) {
          const data = payload.data || {};
          const notification = payload.notification || {};

          console.log('📩 Processing foreground message:', { data, notification });

          // Store notification data
          const notificationData = {
            ...data,
            title: notification.title,
            body: notification.body,
            timestamp: Date.now(),
            source: 'foreground'
          };

          // Add to queue
          window.fcmDataQueue.push(notificationData);

          // Store in localStorage
          const existingData = localStorage.getItem('fcmDataQueue') || '[]';
          const queue = JSON.parse(existingData);
          queue.push(notificationData);
          localStorage.setItem('fcmDataQueue', JSON.stringify(queue));

          // Dispatch event for Flutter
          window.dispatchEvent(new CustomEvent('fcmDataReceived', {
            detail: notificationData
          }));

          // Show browser notification if permission granted
          if (Notification.permission === 'granted') {
            const options = {
              body: notification.body || '',
              icon: '/icons/Icon-192.png',
              badge: '/icons/Icon-192.png',
              data: data,
              tag: 'fcm-notification'
            };

            new Notification(notification.title || 'New Message', options);
          }
        }
      `;

      document.head.appendChild(initScript);
    }

    // Fallback service worker approach
    function initializeServiceWorkerMessaging() {
      console.log("🔄 Initializing fallback service worker messaging...");

      if ('serviceWorker' in navigator) {
        // Create service worker inline
        const swCode = `
          // Fallback service worker for Firebase messaging
          console.log("🔧 Fallback service worker activated");

          // Listen for messages from main thread
          self.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'NOTIFICATION_DATA') {
              const data = event.data.payload;
              console.log('📩 Service worker received notification data:', data);

              // Store in IndexedDB
              storeNotificationData(data);
            }
          });

          async function storeNotificationData(data) {
            try {
              const request = indexedDB.open('fcm-storage', 1);

              request.onupgradeneeded = (event) => {
                const db = event.target.result;
                if (!db.objectStoreNames.contains('notifications')) {
                  const store = db.createObjectStore('notifications', { keyPath: 'id' });
                  store.createIndex('timestamp', 'timestamp', { unique: false });
                  store.createIndex('read', 'read', { unique: false });
                }
              };

              request.onsuccess = () => {
                const db = request.result;
                const transaction = db.transaction(['notifications'], 'readwrite');
                const store = transaction.objectStore('notifications');

                const notificationRecord = {
                  id: Date.now().toString(),
                  data: data,
                  timestamp: Date.now(),
                  read: false
                };

                store.put(notificationRecord);
              };
            } catch (error) {
              console.error('❌ Error storing notification data:', error);
            }
          }
        `;

        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);

        navigator.serviceWorker.register(swUrl, { scope: '/' })
          .then(registration => {
            console.log('✅ Fallback service worker registered:', registration);
          })
          .catch(error => {
            console.error('❌ Fallback service worker registration failed:', error);
          });
      }
    }

    // Request notification permission
    function requestNotificationPermission() {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          Notification.requestPermission().then((permission) => {
            console.log('🔔 Notification permission:', permission);
          });
        }
      }
    }

    // Handle URL parameters (when opened via notification click)
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('fcmData')) {
        try {
          const data = JSON.parse(decodeURIComponent(urlParams.get('fcmData')));
          const timestamp = urlParams.get('timestamp') || Date.now();

          console.log("📩 Notification click data from URL:", data);

          // Store in queue
          window.fcmDataQueue.push({
            ...data,
            timestamp: parseInt(timestamp),
            source: 'url'
          });

          // Store in localStorage
          const existingData = localStorage.getItem('fcmDataQueue') || '[]';
          const queue = JSON.parse(existingData);
          queue.push({
            ...data,
            timestamp: parseInt(timestamp),
            source: 'url'
          });
          localStorage.setItem('fcmDataQueue', JSON.stringify(queue));

          // Clean URL parameters
          const url = new URL(window.location);
          url.searchParams.delete('fcmData');
          url.searchParams.delete('timestamp');
          window.history.replaceState({}, document.title, url.toString());

          // Dispatch event for Flutter
          window.dispatchEvent(new CustomEvent('fcmDataReceived', {
            detail: data
          }));

        } catch (e) {
          console.error("❌ Failed to parse fcmData from URL", e);
        }
      }
    })();

    // Function for Flutter to get all pending notification data
    window.getPendingFcmData = function() {
      const queue = [...window.fcmDataQueue];
      window.fcmDataQueue = []; // Clear the queue

      // Also get from localStorage and clear it
      const storedData = localStorage.getItem('fcmDataQueue');
      if (storedData) {
        try {
          const storedQueue = JSON.parse(storedData);
          queue.push(...storedQueue);
          localStorage.removeItem('fcmDataQueue');
        } catch (e) {
          console.error("❌ Failed to parse stored fcmData", e);
        }
      }

      // Remove duplicates based on timestamp
      const uniqueQueue = queue.filter((item, index, self) =>
        index === self.findIndex(t => t.timestamp === item.timestamp)
      );

      return uniqueQueue;
    };

    // Function to get FCM token
    window.getFcmToken = function() {
      return window.fcmToken || localStorage.getItem('fcmToken') || null;
    };

    // Function to clear specific notification data
    window.clearFcmData = function(timestamp) {
      window.fcmDataQueue = window.fcmDataQueue.filter(item => item.timestamp !== timestamp);
    };

    // Initialize everything when page loads
    window.addEventListener('load', () => {
      requestNotificationPermission();
      initializeFirebaseMessaging();
      window.notificationDataReady = true;
      console.log("🚀 Firebase messaging setup complete");
    });

    // Initialize immediately if document is already loaded
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      requestNotificationPermission();
      initializeFirebaseMessaging();
      window.notificationDataReady = true;
      console.log("🚀 Firebase messaging setup complete (immediate)");
    }

    // Kitchen bell audio for mobile Safari / installed PWAs.
    window.kitchenBells = {
      unlocked: false,
      audios: {},

      soundUrl: function (fileName) {
        return 'assets/assets/sounds/' + fileName + '.mp3';
      },

      preload: function () {
        ['phone_bell', 'update_bell', 'serve_bell', 'delete_bell'].forEach((name) => {
          const audio = new Audio(this.soundUrl(name));
          audio.preload = 'auto';
          audio.playsInline = true;
          audio.setAttribute('playsinline', '');
          audio.setAttribute('webkit-playsinline', '');
          this.audios[name] = audio;
        });
      },

      unlock: function () {
        if (this.unlocked) return;
        Object.keys(this.audios).forEach((name) => {
          const audio = this.audios[name];
          if (!audio) return;
          const clone = audio.cloneNode();
          clone.volume = 0.001;
          clone.play()
            .then(() => {
              clone.pause();
              clone.currentTime = 0;
            })
            .catch(() => {});
        });
        this.unlocked = true;
      },

      play: function (name) {
        const source = this.audios[name];
        if (!source) return false;
        if (!this.unlocked) this.unlock();

        const audio = source.cloneNode();
        audio.volume = 1.0;
        audio.playsInline = true;
        audio.setAttribute('playsinline', '');
        audio.setAttribute('webkit-playsinline', '');

        return audio.play()
          .then(() => true)
          .catch((error) => {
            console.warn('Kitchen bell failed:', name, error);
            return false;
          });
      },

      notify: function (title, body, soundName) {
        if (!('Notification' in window)) return;
        if (Notification.permission === 'granted') {
          new Notification(title, {
            body: body,
            icon: '/icons/Icon-192.png',
            badge: '/icons/Icon-192.png',
            tag: 'kitchen-bell-' + soundName,
            silent: false,
          });
        }
      },
    };

    window.kitchenBellsInit = function () {
      if (!window.kitchenBells.audios || Object.keys(window.kitchenBells.audios).length === 0) {
        window.kitchenBells.preload();
      }
    };

    window.kitchenBellsUnlock = function () {
      window.kitchenBellsInit();
      window.kitchenBells.unlock();
    };

    window.kitchenBellsPlay = function (name) {
      window.kitchenBellsInit();
      if (!window.kitchenBells.audios[name]) return false;
      window.kitchenBells.play(name);
      return true;
    };

    window.kitchenBellsNotify = function (title, body, soundName) {
      window.kitchenBells.notify(title, body, soundName);
    };

    document.addEventListener('touchstart', () => window.kitchenBellsUnlock(), { once: true, passive: true });
    document.addEventListener('click', () => window.kitchenBellsUnlock(), { once: true });
    window.kitchenBellsInit();

    // PWA install prompt bridge for Flutter web
    window.pwaInstall = {
      deferredPrompt: null,

      init: function () {
        window.addEventListener('beforeinstallprompt', (event) => {
          event.preventDefault();
          this.deferredPrompt = event;
          window.dispatchEvent(new CustomEvent('pwa-install-available'));
        });

        window.addEventListener('appinstalled', () => {
          this.deferredPrompt = null;
          window.dispatchEvent(new CustomEvent('pwa-installed'));
        });
      },

      isIosDevice: function () {
        const ua = window.navigator.userAgent || '';
        const isClassicIos = /iPad|iPhone|iPod/.test(ua);
        const isIpadOs = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return isClassicIos || isIpadOs;
      },

      canInstall: function () {
        return !!this.deferredPrompt;
      },

      needsIosManualInstall: function () {
        return this.isIosDevice() && !this.isStandalone();
      },

      isStandalone: function () {
        return window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: window-controls-overlay)').matches ||
          window.navigator.standalone === true;
      },

      promptInstall: async function () {
        if (!this.deferredPrompt) {
          return 'unavailable';
        }

        this.deferredPrompt.prompt();
        const choice = await this.deferredPrompt.userChoice;
        this.deferredPrompt = null;
        return choice.outcome;
      },

      requestInstall: function () {
        this.promptInstall().then((outcome) => {
          window.dispatchEvent(
            new CustomEvent('pwa-install-result', { detail: outcome })
          );
        });
      }
    };

    window.pwaInstall.init();

    window.flutterPwaCanInstall = function () {
      return window.pwaInstall && window.pwaInstall.canInstall();
    };

    window.flutterPwaNeedsIosInstall = function () {
      return window.pwaInstall && window.pwaInstall.needsIosManualInstall();
    };

    window.flutterPwaIsStandalone = function () {
      return window.pwaInstall && window.pwaInstall.isStandalone();
    };

    window.flutterPwaRequestInstall = function () {
      if (window.pwaInstall) {
        window.pwaInstall.requestInstall();
      }
    };

    if (window.flutterPwaNeedsIosInstall()) {
      window.dispatchEvent(new CustomEvent('pwa-install-available'));
    }
</script>
