name: smartKitchen
description: Every table. Every order. One kitchen screen.
publish_to: none
version: 1.0.7+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:       # CRITICAL: Required for every Flutter project - DO NOT REMOVE
    sdk: flutter # CRITICAL: Required for every Flutter project - DO NOT REMOVE

  # CRITICAL: Core UI and responsive design - DO NOT REMOVE OR +-
  flutter_staggered_grid_view: ^0.7.0
  pdf: ^3.11.0
  printing: ^5.12.0
  path_provider: ^2.1.5
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  #  flutter_sms: ^2.3.3
  firebase_core: ^4.12.1
#  firebase_storage:
  cloud_firestore: ^6.7.1
  get: ^4.6.6
  dotted_line: ^3.0.0
  intl: ^0.18.1
  audioplayers:
  flutter_tts: ^4.2.5
  flutter_svg: ^2.0.14
  shared_preferences: ^2.5.3
  firebase_auth: ^6.5.6
  cloud_functions: ^6.3.5
  record: ^6.0.0
  http: ^1.2.0
  google_generative_ai: ^0.4.6
  excel: ^4.0.6
  image_picker: ^1.1.2
  crypto: ^3.0.6
  receive_sharing_intent: ^1.8.1
  pasteboard: ^0.5.0
  flutter_foreground_task: ^9.2.2
  file_selector: ^1.1.0


  firebase_remote_config: ^6.5.6
  package_info_plus: ^9.0.1
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4
  image: ^4.3.0

dev_dependencies:
  flutter_test:    # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
    sdk: flutter   # CRITICAL: Required for Flutter project testing - DO NOT REMOVE
  flutter_lints: ^5.0.0 # CRITICAL: Required for code quality - DO NOT REMOVE
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  web:
    generate: true
    background_color: "#FFFFFF"
    theme_color: "#1A3A5C"
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true # CRITICAL: Required for Material icon font - DO NOT REMOVE
  assets:
    - assets/
    - assets/certs/
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Mulish Black
      fonts:
        - asset: assets/fonts/Mulish-Black.ttf
    - family: Mulish Bold
      fonts:
        - asset: assets/fonts/Mulish-Bold.ttf
    - family: Mulish Light
      fonts:
        - asset: assets/fonts/Mulish-Light.ttf
    - family: Mulish Medium
      fonts:
        - asset: assets/fonts/Mulish-Medium.ttf
    - family: Mulish Regular
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
    - family: Mulish SemiBold
      fonts:
        - asset: assets/fonts/Mulish-SemiBold.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf



  # CRITICAL ASSET MANAGEMENT RULES:
  # - DO NOT ADD NEW ASSET DIRECTORIES (assets/svg/, assets/icons/, etc.)
  # - ONLY USE EXISTING AND ITEMS AVAILABLE IN THE DIRECTORIES LISTED ABOVE (assets/, assets/images/)

  # CRITICAL FONTS RULE:
  # - THIS PROJECT USES GOOGLE FONTS INSTEAD OF LOCAL FONTS
  # - DO NOT ADD ANY LOCAL FONTS SECTION OR FONT FILES
